# Classical-control comparison: is the nonlinear-observable hardness a property of the
# p -> score functional, or does it need the quantum feature map?
#
# Matched triples at (m=6, k=m//2=3, n_fock=56): the SAME observable through the SAME scoring
# code on three maps that share the Fock basis and differ only in x -> p.
#
#   photonic_quantum  W2 P(x) W1 boson sampling      2 m^2 = 72 params  (#P-hard amplitudes)
#   ebm_fock          p ~ exp(theta(x).phi(n))       O(m^2) = 6.7k      POLY-SIZE control
#   mlp_fock          dense 2*n_fock output layer    34.6k -> 19.9M     capacity-unbounded ref
#
# ebm_fock is the control that can answer "is a small classical model enough": mlp_fock's
# parameter count grows exponentially in m, which hands the classical side the very resource
# the quantum claim is about, so it only upper-bounds what any classical map could do.
#
# parity is the CALIBRATION control -- it must come out easy on every map, else that map is
# too high-frequency and its nonlinear numbers are not interpretable.
#
#   python -m Generator --configs-dir configs/Classical
name: "parity / mlp"
problem:
  m: 6
  k: 3                       # k = m//2 -> n_fock = C(m+k-1, k) = 56
  observable: parity
  n_features: null           # -> m-1 = 5
generation:
  generator: mlp_fock
  size: 10000
  nsample: 0                 # exact probabilities: osc is not recoverable from few shots
split:
  test_fraction: 0.20
  split_seed: 0
seeds:
  sample_seed: 42
  teacher_seed: 42
