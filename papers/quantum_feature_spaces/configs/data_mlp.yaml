# Grid dataset: teacher = mlp
#   python -m Generator --config configs/data_mlp.yaml
problem:
  m: 6
  k: 3
  observable: parity
  n_features: null          # -> m-1 = 5
generation:
  generator: mlp
  size: 100000                # small pool: kernel SVM is O(N^2); the grid caps rows anyway
  nsample: 0
split:
  test_fraction: 0.20
  split_seed: 0
seeds:
  sample_seed: 42
  teacher_seed: 42
