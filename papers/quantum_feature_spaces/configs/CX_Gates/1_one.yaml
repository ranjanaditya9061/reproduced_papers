name: "1 CX"
# spoqc spin-photon dataset, one CX (0-1) entangler.
# Same generator as the base; the CX variant is set purely by problem.cx_pairs.
#   python -m Generator --config configs/data_spoqc_photonic_one.yaml
problem:
  m: 6
  k: 3
  observable: n_first
  n_features: null          # -> m-1 = 5
  cx_pairs: [[0, 1]]        # spoqc-only: CX entanglers in the spin prep
generation:
  generator: spoqc_photonic
  size: 10000               # one circuit per sample -> slow; keep modest
  nsample: 0
split:
  test_fraction: 0.20
  split_seed: 0
seeds:
  sample_seed: 42
  teacher_seed: 42
