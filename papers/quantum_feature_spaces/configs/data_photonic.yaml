# Grid dataset: teacher = photonic_quantum
#   python -m Generator --config configs/data_photonic.yaml
problem:
  m: 8
  k: 4
  observable: majority
  n_features: null          # -> m-1 = 5
generation:
  generator: photonic_quantum
  size: 10000                # small pool: kernel SVM is O(N^2); the grid caps rows anyway
  nsample: 0
split:
  test_fraction: 0.20
  split_seed: 0
seeds:
  sample_seed: 42
  teacher_seed: 42
